name: check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      use_cache:
        description: Restore dependency and compilation caches
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    env:
      LANG: C
      LC_ALL: C
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: hustcer/setup-moonbit@v1.23
        with:
          version: 0.10.15+943464bfa
          core-version: 0.10.15+943464bfa
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Toolchain and report directory
        run: |
          mkdir -p test-reports
          moon version --all | tee test-reports/toolchain.log
      - uses: actions/cache@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.use_cache }}
        with:
          path: |
            ~/.moon/cache/deps
            .mooncakes
            core/.mooncakes
            tests/.mooncakes
            commands/*/.mooncakes
            _build/native/release
            _build/wasm/release
          key: wasm-ci-v1-${{ runner.os }}-${{ runner.arch }}-0.10.15-${{ hashFiles('moon.work', '**/moon.mod', '**/moon.pkg') }}-${{ github.sha }}
          restore-keys: |
            wasm-ci-v1-${{ runner.os }}-${{ runner.arch }}-0.10.15-${{ hashFiles('moon.work', '**/moon.mod', '**/moon.pkg') }}-
      - name: Linux listener observer
        if: runner.os == 'Linux'
        run: command -v lsof || (sudo apt-get update && sudo apt-get install --yes lsof)
      - name: Dependencies
        run: moon update
      - name: Check Wasm products
        run: moon check --target wasm --deny-warn
      - name: Check Native test tools
        run: moon check --target native --deny-warn tests/runner tests/release_runner tests/testkit tests/registry tests/network_scenarios tests/mv_scenarios tests/benchmark
      - name: Build Wasm commands once
        run: moon build --target wasm --release --deny-warn
      - name: Build test driver
        run: moon build --target native --release --deny-warn tests/runner
      - name: Wasm package tests
        run: moon test --target wasm --release --deny-warn --no-parallelize 2>&1 | tee test-reports/packages-wasm.log
      - name: Native test-tool regressions
        run: moon test --target native --release --deny-warn --no-parallelize tests/testkit tests/registry tests/network_scenarios tests/mv_scenarios tests/runner tests/release_runner tests/benchmark 2>&1 | tee test-reports/packages-harness.log
      - uses: docker/setup-buildx-action@v3
        if: runner.os == 'Linux'
      - name: Pinned upstream image
        id: oracle
        if: runner.os == 'Linux'
        uses: docker/build-push-action@v6
        with:
          context: tests/runner/image
          load: true
          tags: mooncmd-oracle:phase0
          cache-from: ${{ (github.event_name != 'workflow_dispatch' || inputs.use_cache) && 'type=gha,scope=mooncmd-oracle' || '' }}
          cache-to: type=gha,mode=max,scope=mooncmd-oracle
      - name: Record pinned oracle
        if: runner.os == 'Linux'
        run: moon run tests/oracle.mbtx -- --image '${{ steps.oracle.outputs.imageid }}'
      - name: Wasm functional checks and Linux upstream comparisons
        run: moon run tests/ci.mbtx -- functional
      - name: Interfaces and harness formatting
        if: runner.os == 'Linux'
        run: |
          moon info
          moon fmt --check tests
          git diff --exit-code
      - name: Preserve results and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmd-test-reports-${{ matrix.os }}
          path: test-reports
          retention-days: 7
          if-no-files-found: warn
