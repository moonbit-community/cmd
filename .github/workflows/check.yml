name: check

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    env:
      MOON_HOME: ${{ github.workspace }}/.moon-home
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1.23
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update registry
        run: moon update

      - name: Check
        run: moon check --target all --deny-warn

      - name: Test
        run: moon test --target all

      - name: Build release commands
        run: moon build --target native --release --deny-warn

      - name: Compatibility
        run: moon run --target native tests/compat -- --bin-root _build/native/release/build

      - name: GNU differential
        if: runner.os == 'Linux'
        run: moon run --target native tests/compat -- --bin-root _build/native/release/build --gnu-diff

      - name: Wasm policy
        run: moon run --target native tests/policy -- --root .

      - name: Generated interfaces
        run: moon info

      - name: Format
        run: moon fmt

      - name: Verify generated files
        run: git diff --exit-code

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmd-check-${{ matrix.os }}
          path: |
            _build
            uncovered.log
          if-no-files-found: ignore

  stress:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      MOON_HOME: ${{ github.workspace }}/.moon-home
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1.23
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update registry
        run: moon update

      - name: Build release commands
        run: moon build --target native --release --deny-warn

      - name: Stress compatibility
        run: moon run --target native tests/compat -- --bin-root _build/native/release/build --stress
