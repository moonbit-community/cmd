name: resource observations

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Resource profile
        type: choice
        options: [all, records, long, heldout, kernel-rss-linux, performance, stability-diagnostic]
        default: all
      commands:
        description: Optional comma-separated command names
        type: string
        default: ''
      diagnostic_phase:
        description: Hypothesis set for stability-diagnostic only
        type: choice
        options: [observer, cache]
        default: observer

permissions:
  contents: read

concurrency:
  group: resources-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      LANG: C
      LC_ALL: C
      TZ: UTC
      DOCKER_BUILD_RECORD_RETENTION_DAYS: 30
      CMD_RESOURCE_PROFILE: ${{ inputs.profile }}
      CMD_RESOURCE_COMMANDS: ${{ inputs.commands }}
      CMD_BENCH_DIAGNOSTIC_PHASE: ${{ inputs.diagnostic_phase }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: hustcer/setup-moonbit@v1.23
        with:
          version: 0.10.17+d971670cd
          core-version: 0.10.17+d971670cd
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Toolchain and report directory
        run: |
          mkdir -p test-reports
          moon version --all | tee test-reports/toolchain.log
      - run: moon update
      - run: moon build --target wasm --release --deny-warn
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Pinned upstream image
        id: oracle
        uses: docker/build-push-action@v6
        with:
          context: tests/runner/image
          load: true
          tags: mooncmd-oracle:phase0
          cache-from: type=gha,scope=mooncmd-oracle
          cache-to: type=gha,mode=max,scope=mooncmd-oracle
      - name: Observe selected resource profiles
        timeout-minutes: 120
        run: moon run tests/resources/ci.mbtx -- --image '${{ steps.oracle.outputs.imageid }}' 2>&1 | tee test-reports/resources.log
      - name: Preserve resource observations
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: resource-observations-linux
          path: |
            test-reports/toolchain.log
            test-reports/resources.log
            test-reports/resources-linux
            !test-reports/resources-linux/oracle/**
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve interrupted resource logs
        if: cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: resource-observations-linux
          path: |
            test-reports/*.log
            test-reports/resources-linux/setup.json
            test-reports/resources-linux/profiles.json
          retention-days: 30
          if-no-files-found: warn
