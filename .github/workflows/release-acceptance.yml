name: release acceptance

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Exact published coordinates to verify; no packages are uploaded
        type: choice
        options: [latest, candidate]
        default: latest

permissions:
  contents: read

concurrency:
  group: release-acceptance-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  acceptance:
    name: published functional (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    env:
      LANG: C
      LC_ALL: C
      TZ: UTC
      CMD_RELEASE_MANIFEST: tests/release_runner/current/${{ inputs.manifest }}.json
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: hustcer/setup-moonbit@v1.23
        with:
          version: 0.10.15+943464bfa
          core-version: 0.10.15+943464bfa
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Toolchain and dependencies
        run: |
          mkdir -p test-reports
          moon version --all | tee test-reports/toolchain.log
          moon update
      - name: Linux listener observer
        if: runner.os == 'Linux'
        run: command -v lsof || (sudo apt-get update && sudo apt-get install --yes lsof)
      - name: Build acceptance tools
        run: moon build --target native --release --deny-warn tests/runner tests/release_runner
      - uses: docker/setup-buildx-action@v3
        if: runner.os == 'Linux'
      - name: Pinned upstream image
        id: oracle
        if: runner.os == 'Linux'
        uses: docker/build-push-action@v6
        with:
          context: tests/runner/image
          load: true
          tags: mooncmd-oracle:phase0
          cache-from: type=gha,scope=mooncmd-oracle
          cache-to: type=gha,mode=max,scope=mooncmd-oracle
      - name: Record pinned oracle
        if: runner.os == 'Linux'
        run: moon run tests/oracle.mbtx -- --image '${{ steps.oracle.outputs.imageid }}'
      - name: Exact-version functional acceptance
        run: moon run tests/ci.mbtx -- published
      - name: Preserve acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-results-${{ matrix.os }}
          path: test-reports
          retention-days: 30
          if-no-files-found: error
